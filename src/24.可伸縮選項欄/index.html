<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="opt-bar-box">
        <label class="opt-item">
            <div class="icon-box">
                <div class="icon"><i class="bx bx-home"></i></div>
            </div>

            <input type="radio" name="opt" checked>
            <div class="opt-name">
                <span>Home</span>
            </div>
        </label>

        <label class="opt-item">
            <div class="icon-box">
                <div class="icon"><i class="bx bx-treasure-chest"></i></div>
            </div>

            <input type="radio" name="opt" >
            <div class="opt-name">
                <span>Tools</span>
            </div>
        </label>

        <label class="opt-item">
            <div class="icon-box">
                <div class="icon"><i class="bx bx-cog"></i></div>
            </div>

            <input type="radio" name="opt" >
            <div class="opt-name">
                <span>Settings</span>
            </div>
        </label>

        <label class="opt-item">
            <div class="icon-box">
                <div class="icon"><i class="bx bx-apps"></i></div>
            </div>

            <input type="radio" name="opt" >
            <div class="opt-name">
                <span>More Apps</span>
            </div>
        </label>
    </div>
    
    <script src="./main.js"></script>
</body>
</html>
